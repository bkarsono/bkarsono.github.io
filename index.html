<!DOCTYPE html>
<html>
  <head>
    <title>Benjamin Karsono's Portfolio</title>
    <link rel="shortcut icon" href="./assets/favicon.ico" />
    <!--Bootstrap 5-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!--Optional Theme-->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css"
      integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp"
      crossorigin="anonymous"
    />
    <!--Custom Style-->
    <link rel="stylesheet" type="text/css" href="./index.css" />
    <!--Vue-->
    <script src="https://unpkg.com/vue@3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.19.0/axios.min.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Main Page -->
      <div class="flex-fill">
        <!-- Top Bar -->
        <nav class="navbar navbar-default sticky-top">
          <div class="container">
            <div>
              <span class="fs-3">Benjamin Karsono</span>
            </div>
            <div class="topbar-buttons">
              <button @click="currentTab = 'About Me'">
                <span :class="{'fw-bold': currentTab === 'About Me'}"
                  >About Me</span
                >
              </button>
              <button @click="currentTab = 'Projects'">
                <span :class="{'fw-bold': currentTab === 'Projects'}"
                  >Projects</span
                >
              </button>
            </div>
            <div class="topbar-buttons">
              <a href="https://x.com/nachoboy999" target="_blank"
                ><button><img src="./assets/logo-twitter.svg" /></button
              ></a>
              <a href="https://linkedin.com/in/bkarsono/" target="_blank"
                ><button><img src="./assets/logo-linkedin.svg" /></button
              ></a>
              <a href="https://instagram.com/nachoboy999" target="_blank"
                ><button><img src="./assets/logo-instagram.svg" /></button
              ></a>
            </div>
          </div>
        </nav>
        <!-- Content -->
        <div class="container">
          <div class="row">
            <div v-if="currentTab === 'About Me'" class="col-12">
              <h4>Welcome!</h4>
              <span
                >I am currently working on receiving my Master's degree in
                Computer Science from the University of Michigan. I love
                football and video games!</span
              >
              <h4>Email</h4>
              <span>bkarsono@umich.edu</span>
            </div>
            <div v-for="project in projects" class="project col-6">
              <div v-if="currentTab === 'Projects'" class="row">
                <h4>{{project.name}}</h4>
                <div class="col-sm-4 project-img">
                  <a :href="project.imgHref" target="_blank"><img :src="project.imgUrl" /></a>
                </div>
                <div class="col-sm-6">{{project.description}}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
